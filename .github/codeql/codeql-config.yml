# CodeQL analysis config.
#
# Referenced from .github/workflows/codeql.yml.

name: "Finlytics CodeQL config"

paths-ignore:
  # Vendored third-party worker, generated by `npx msw init` and carrying an
  # explicit "Please do NOT modify this file" header plus a version checksum MSW
  # verifies at runtime. Dependabot regenerates it on every msw bump, so a local
  # edit would be silently reverted and the alert would come back.
  #
  # It trips js/missing-origin-check ("Missing origin verification in postMessage
  # handler"), which is a false positive inside a ServiceWorkerGlobalScope:
  #
  #   * A service worker is reachable only by SAME-ORIGIN clients. A cross-origin
  #     document cannot obtain a handle to it — `navigator.serviceWorker` is
  #     same-origin scoped — so `event.origin` is invariably our own origin and
  #     checking it would be a no-op. The query is tuned for
  #     `window.addEventListener('message')`, where cross-origin frames really can
  #     post to you.
  #   * The handler already authenticates its sender more strictly than an origin
  #     check would: it reads `event.source.id` and drops the message unless
  #     `self.clients.get(id)` resolves, i.e. unless it came from a client this
  #     worker actually controls.
  #
  # Scoped to the single generated file so all first-party code stays analysed.
  - frontend/public/mockServiceWorker.js
