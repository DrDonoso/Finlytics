# Dependabot configuration — https://docs.github.com/code-security/dependabot
#
# Covers every manifest in the repo:
#   pip             -> pyproject.toml
#   npm             -> frontend/package.json + package-lock.json
#   github-actions  -> .github/workflows/*.yml
#   docker          -> Dockerfile
#   docker-compose  -> docker-compose.yml, docker-compose.local.yml, docker-compose.demo.yml
#
# GROUPING RULE
# -------------
# Minor and patch updates are grouped freely — they are safe to merge wholesale
# and grouping keeps the PR count sane for a single maintainer.
#
# Major updates get their OWN pull request, because each one may need code
# changes and has to be reviewed on its own. A group without `update-types`
# swallows majors too: that is how PR #15 ended up bundling vite 5->8,
# TypeScript 5->7 and plugin-react 4->6 into a single unmergeable PR — one
# failure blocked all three, and none could be adopted independently.
#
# The exception is packages that MUST move in lockstep, where splitting would
# produce a PR that cannot build on its own. Those groups deliberately omit
# `update-types` so their majors stay together.
#
# Security updates ignore grouping and open-pull-requests-limit entirely, so
# none of this delays a vulnerability fix.

version: 2
updates:
  # ── Python backend ─────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── React frontend ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Lockstep: react-dom 19 requires react 19, and the @types must match the
      # runtime version. A PR bumping only one of them cannot type-check.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Lockstep: @vitejs/plugin-react declares a peer dependency on vite, so a
      # vite major and its plugin major have to land together.
      vite:
        patterns: ["vite", "@vitejs/*"]
      # Everything else — notably typescript, which is independent of vite —
      # is grouped for minor/patch only, so its majors arrive one at a time.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Stale actions are a real supply-chain surface: they run with repository
  # credentials.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Container base images (Dockerfile) ─────────────────────────────────────
  # node, python and nginx are independent runtimes — a major of one must not be
  # blocked by a major of another.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Compose service images (postgres, etc.) ────────────────────────────────
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 10
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
