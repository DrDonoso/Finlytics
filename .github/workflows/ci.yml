# CI — validates every pull request against the artefact that actually ships.
#
# The deployable is a Docker image running in an LXC, not code on a host with
# preinstalled toolchains. So the authoritative job here is `image`: it builds
# the real multi-stage Dockerfile and boots it against a real Postgres, which is
# the only way to catch:
#
#   * base-image bumps (node:20 -> node:26, python:3.12 -> 3.14)
#   * musl vs glibc — the frontend compiles inside node:alpine, and esbuild /
#     rollup ship platform-specific native binaries
#   * `alembic upgrade head` and `seed.py`, which the entrypoint runs on boot
#   * the SPA actually being built and copied into the image
#
# `tests` is the fast unit-level signal (pytest, mypy and ruff), plus
# `tests/pg`: the upserts, queries, backup restore and migration chain that only
# PostgreSQL can execute, run against a service container. `frontend` covers
# lint + unit tests + type-check + build for the SPA, and `e2e` signs in to the
# built demo in a real browser; `image` is the one that decides whether the
# thing runs.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Dependabot does not bump service images: keep in lockstep with the db
    # image in docker-compose.yml by hand.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finlytics
          POSTGRES_PASSWORD: finlytics
          POSTGRES_DB: finlytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finlytics"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Keep in lockstep with the python base image in the Dockerfile.
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The image's uv stage is the single pin, so a Dependabot bump of that tag
      # moves CI along with it.
      - name: Read the uv version from the Dockerfile
        id: uv-version
        run: |
          version=$(sed -nE 's#^FROM ghcr\.io/astral-sh/uv:([0-9][0-9.]*) AS uv.*#\1#p' Dockerfile)
          if [ -z "$version" ]; then
            echo "::error file=Dockerfile::no 'FROM ghcr.io/astral-sh/uv:<version> AS uv' stage found"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ steps.uv-version.outputs.version }}
          python-version: ${{ steps.python.outputs.python-path }}

      # Same failure as the npm lockfile check below: a lock resolved through a
      # private mirror records the mirror's URLs, and Dependabot cannot
      # authenticate against it. Re-lock against PyPI instead of committing it.
      - name: Lockfile resolves from the public PyPI
        run: |
          stray=$(grep -oE '(registry|url) = "[^"]+"' uv.lock \
            | grep -vE '^registry = "https://pypi\.org/simple"$|^url = "https://files\.pythonhosted\.org/' || true)
          if [ -n "$stray" ]; then
            echo "$stray" | sort -u | head -n 20
            echo "::error file=uv.lock::$(echo "$stray" | wc -l) sources resolve outside pypi.org"
            exit 1
          fi

      # --locked fails on a lock that is out of date with pyproject.toml, so the
      # suite runs against exactly the versions the image installs.
      - name: Install locked dependencies with test extras
        run: uv sync --locked --extra test

      # tests/pg skips without TEST_DATABASE_URL locally, but fails under CI, so
      # losing the service cannot quietly turn that coverage off.
      - name: Run test suite
        env:
          AUTH_SECRET: ci-only-not-a-real-secret-value-000000
          TEST_DATABASE_URL: postgresql+asyncpg://finlytics:finlytics@localhost:5432/finlytics
        run: uv run --no-sync pytest -q

      # The whole package. The API layer returns the query layer's TypedDicts,
      # so a change in data shape fails here instead of at serialisation time.
      - name: Type-check (mypy)
        run: uv run --no-sync mypy

      # The rule set lives in pyproject.toml. Blind excepts need a reason
      # (`# noqa: BLE001 — why`) or a log.exception that keeps the traceback.
      - name: Lint (ruff)
        run: uv run --no-sync ruff check src tests alembic

  # The frontend had no linter, and that let real bugs through: CSS selectors
  # that never matched, untranslated strings and incomplete effect dependencies.
  # This job exists so they stop piling up.
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Keep in lockstep with the node base image in the Dockerfile.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # An install behind a private npm mirror records the mirror's tarball URLs.
      # Dependabot cannot authenticate against it, so every update touching those
      # packages fails silently, security fixes included. Rewrite the prefix to
      # https://registry.npmjs.org/: same tarballs, so the integrity hashes match.
      - name: Lockfile resolves from the public npm registry
        run: |
          stray=$(grep '"resolved":' package-lock.json | grep -v '"https://registry.npmjs.org/' || true)
          if [ -n "$stray" ]; then
            echo "$stray" | head -n 20
            echo "::error file=frontend/package-lock.json::$(echo "$stray" | wc -l) packages resolve outside registry.npmjs.org"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      # `npm run build` runs `tsc --noEmit` first.
      - name: Type-check and build
        run: npm run build

  # The vitest demo test renders pages in jsdom. This one drives the built demo
  # bundle in a real browser, so it also catches what only a build shows: a lazy
  # chunk that fails to load, the Service Worker not starting, a chart that
  # throws on real layout, a request the demo does not serve.
  e2e:
    name: Demo smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the demo, serves it and signs in to every
      # route the demo exposes.
      - name: Smoke test the demo build
        run: npm run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  image:
    name: Image builds, boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Job-level: every later `docker compose` call (exec, logs, down) re-evaluates
    # docker-compose.yml, which interpolates POSTGRES_PASSWORD with no default.
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      AUTH_SECRET: ci-only-not-a-real-secret-value-000000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Deliberately the default target of the full multi-stage Dockerfile —
      # the same image CI/prod publishes, not the `demo` target.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: drdonoso/finlytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: |
          mkdir -p ./data
          # The container runs as uid 1000; the bind mount must be writable.
          sudo chown -R 1000:1000 ./data

          # docker-compose.yml pins `image: drdonoso/finlytics`. Retag the image
          # we just built so compose uses it instead of pulling from Docker Hub.
          docker tag drdonoso/finlytics:ci drdonoso/finlytics:latest

          # Pull only the database image. `--pull never` on `up` then guarantees
          # the app image is the one built above and never fetched from the
          # registry — without it, a green run could be testing a stale
          # published image instead of this PR.
          docker compose pull db
          docker compose up -d --pull never

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7777/health > /dev/null 2>&1; then
              echo "Healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Container never became healthy"
          exit 1

      - name: Smoke test
        run: |
          set -euo pipefail

          echo "--- /health returns ok ---"
          curl -fsS http://localhost:7777/health | tee /dev/stderr | grep -q '"status":"ok"'

          # Public route that touches the database. Passing here proves the app
          # connected to Postgres and `alembic upgrade head` completed, because
          # it queries the users table the migrations create.
          echo "--- /api/auth/status reaches the DB ---"
          curl -fsS http://localhost:7777/api/auth/status | tee /dev/stderr | grep -q 'initialized'

          # Auth must actually be enforced in the shipped image, not just in tests.
          echo "--- protected route rejects anonymous callers ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7777/api/version)
          if [ "$code" != "401" ]; then
            echo "::error::/api/version returned $code, expected 401"
            exit 1
          fi

          # Proves the Node stage ran and frontend/dist was copied in.
          echo "--- SPA is served ---"
          curl -fsS http://localhost:7777/ | grep -qi '<div id="root">'

      - name: Verify migrations reached head
        run: |
          set -euo pipefail
          applied=$(docker compose exec -T db \
            psql -U finlytics -d finlytics -tAc \
            'SELECT version_num FROM alembic_version')
          echo "alembic_version = $applied"
          if [ -z "$applied" ]; then
            echo "::error::alembic_version is empty — migrations did not run"
            exit 1
          fi
          # Base categories are seeded by the entrypoint.
          categories=$(docker compose exec -T db \
            psql -U finlytics -d finlytics -tAc \
            'SELECT count(*) FROM categories')
          echo "seeded categories = $categories"
          if [ "$categories" -lt 1 ]; then
            echo "::error::seed.py did not insert base categories"
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
