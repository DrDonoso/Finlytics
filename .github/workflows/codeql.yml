# CodeQL — static analysis for the Python backend and the React frontend.
#
# Free on public repositories. Results land in the Security tab under
# "Code scanning". Runs on pushes to main, on PRs, and weekly so newly
# published queries catch old code.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:17 UTC — offset from :00 to avoid GitHub's peak scheduling load
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Code scanning is free on public repos; on private ones it needs GitHub
    # Advanced Security. Skip rather than fail while the repo is still private —
    # this starts running by itself the moment visibility flips to public.
    if: ${{ !github.event.repository.private }}

    permissions:
      security-events: write   # required to upload SARIF results
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-severity but still real findings on top
          # of the default query suite.
          queries: security-extended
          # Excludes vendored/generated third-party files; see the config for the
          # per-entry justification.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
