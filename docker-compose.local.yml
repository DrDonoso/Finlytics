# Local dev stack — identical to docker-compose.yml except that it BUILDS the
# image from the current working tree instead of pulling the published one.
# Use it to run uncommitted code; `docker-compose.yml` would serve whatever was
# last pushed to Docker Hub.
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# No host pre-build is needed: the main Dockerfile compiles the SPA itself.

services:
  api:
    build:
      context: .
    image: drdonoso/finlytics
    restart: unless-stopped
    ports:
      - "${FINLYTICS_PORT:-7777}:7777"

    environment:
      # --- PostgreSQL connection ---
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-finlytics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finlytics}"

      # --- OpenAI (for AI transaction extraction) ---
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"

      # --- App config ---
      TIMEZONE: "${TIMEZONE:-Europe/Madrid}"
      UPLOAD_DIR: /app/data/uploads

      # --- Auth ---
      AUTH_SECRET: "${AUTH_SECRET:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_TOKEN_EXPIRE_DAYS: "${AUTH_TOKEN_EXPIRE_DAYS:-7}"
      FINLYTICS_ENCRYPTION_KEY: "${FINLYTICS_ENCRYPTION_KEY:-}"

    volumes:
      - "${FINLYTICS_DATA_DIR:-./data}:/app/data"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-finlytics}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-finlytics}"

    volumes:
      # postgres 18+ stores data under major-version-specific directories, so the
      # mount is /var/lib/postgresql (not .../data as it was on 16). The image
      # refuses to start if it finds a 16-era data directory at the old path.
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finlytics}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
