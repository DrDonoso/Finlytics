# Finlytics — Alembic configuration
# Generated for async SQLAlchemy (asyncpg driver).
# sqlalchemy.url is overridden at runtime by alembic/env.py reading settings.database_url.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder; env.py overrides this from finlytics.config.settings
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
