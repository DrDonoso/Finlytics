[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlytics"
version = "0.1.0"
description = "Personal bank-account expense tracking with AI-powered extraction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DrDonoso" }]
keywords = ["finance", "budgeting", "self-hosted", "fastapi", "personal-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "cryptography>=43",
    "httpx>=0.27",
    "yfinance>=0.2.43",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "reportlab>=4.0",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/DrDonoso/Finlytics"
Repository = "https://github.com/DrDonoso/Finlytics"
Issues = "https://github.com/DrDonoso/Finlytics/issues"
Changelog = "https://github.com/DrDonoso/Finlytics/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
