[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlytics"
version = "0.1.0"
description = "Personal bank-account expense tracking with AI-powered extraction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DrDonoso" }]
keywords = ["finance", "budgeting", "self-hosted", "fastapi", "personal-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "cryptography>=43",
    "httpx>=0.27",
    "yfinance>=0.2.43",
    # Rule patterns are user-authored, and only this engine offers a per-call
    # `timeout` — the sole way to stop a catastrophically-backtracking pattern,
    # since CPython holds the GIL for the whole of a regex match.
    "regex>=2024.5.15",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "reportlab>=4.0",
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/DrDonoso/Finlytics"
Repository = "https://github.com/DrDonoso/Finlytics"
Issues = "https://github.com/DrDonoso/Finlytics/issues"
Changelog = "https://github.com/DrDonoso/Finlytics/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
# Comprobacion centrada en la capa de consultas, que es la frontera entre la
# base de datos y la API: es donde un cambio de forma en los datos se propaga
# en silencio hasta que Pydantic falla al serializar la respuesta.
files = ["src/finlytics/db/queries", "src/finlytics/clock.py", "src/finlytics/auth"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Falsos positivos de los stubs de SQLAlchemy 2.0, comprobados en ejecucion:
#
#  * typeddict-item / attr-defined sobre `.count`: los stubs declaran Row como
#    Sequence, asi que mypy resuelve `row.count` al metodo de Sequence en lugar
#    de a la columna. En SQLAlchemy 2.0.51 Row NO hereda de tuple y el acceso
#    por nombre gana, cosa que ademas cubren los tests de extractos y resumenes.
#  * attr-defined sobre `Result.rowcount`: `session.execute()` esta anotado como
#    Result, pero en un DELETE devuelve un CursorResult, que si lo expone.
#  * assignment / arg-type al reasignar un Select a Subquery: mypy fija el tipo
#    de la variable en la primera asignacion y no admite el .subquery() posterior.
module = "finlytics.db.queries.*"
disable_error_code = ["typeddict-item", "attr-defined", "assignment", "arg-type"]

[tool.setuptools]
include-package-data = true

# El marcador py.typed le dice a mypy y a los editores que las anotaciones de
# este paquete son fiables. Sin el, los TypedDict de la capa de consultas se
# ignoran y la comprobacion de tipos no sirve de nada fuera del propio modulo.
[tool.setuptools.package-data]
finlytics = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
