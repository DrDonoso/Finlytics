[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finlytics"
version = "0.1.0"
description = "Personal bank-account expense tracking with AI-powered extraction"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DrDonoso" }]
keywords = ["finance", "budgeting", "self-hosted", "fastapi", "personal-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "openai>=1.40",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "cryptography>=43",
    "httpx>=0.27",
    "yfinance>=0.2.43",
    # Rule patterns are user-authored, and only this engine offers a per-call
    # `timeout` — the sole way to stop a catastrophically-backtracking pattern,
    # since CPython holds the GIL for the whole of a regex match.
    "regex>=2024.5.15",
    # Already pulled in by Starlette, declared because the assistant imports it:
    # its shielded cancel scope is what lets an abandoned turn still record what
    # it cost after Starlette cancels the stream.
    "anyio>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "reportlab>=4.0",
    "aiosqlite>=0.20",
    "mypy>=1.13",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/DrDonoso/Finlytics"
Repository = "https://github.com/DrDonoso/Finlytics"
Issues = "https://github.com/DrDonoso/Finlytics/issues"
Changelog = "https://github.com/DrDonoso/Finlytics/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Deployed migrations are never edited, so they are not linted either.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Ruff's default rule set, whose version uv.lock pins. Each exception is a convention.
ignore = [
    "FURB157",  # Decimal("10"): every monetary literal is a string, so none is ever a float
    "RUF022",   # __all__ is ordered by topic or emission order, not alphabetically
    "SIM103",   # a run of guard clauses reads better than folding the last one into the return
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["FLY002"]  # "\n".join over a list keeps statement fixtures readable line by line

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.mypy]
python_version = "3.12"
# The whole package. The API layer declares the query layer's TypedDicts as its
# return types, so a change in data shape fails here instead of when Pydantic
# serialises the response.
files = ["src/finlytics"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# False positives from the SQLAlchemy 2.0 stubs, verified at runtime:
#
#  * typeddict-item / attr-defined on `.count`: the stubs declare Row as a
#    Sequence, so mypy resolves `row.count` to Sequence's method instead of to
#    the column. In SQLAlchemy 2.0.51 Row does NOT inherit from tuple and access
#    by name wins, which the statement and summary tests also cover.
#  * attr-defined on `Result.rowcount`: `session.execute()` is annotated as
#    Result, but on a DELETE it returns a CursorResult, which does expose it.
#  * assignment / arg-type when reassigning a Select to a Subquery: mypy pins
#    the variable's type on first assignment and rejects the later .subquery().
module = "finlytics.db.queries.*"
disable_error_code = ["typeddict-item", "attr-defined", "assignment", "arg-type"]

[tool.setuptools]
include-package-data = true

# The py.typed marker tells mypy and editors that this package's annotations are
# reliable. Without it the query layer's TypedDicts are ignored and type checking
# is useless outside the module itself.
[tool.setuptools.package-data]
finlytics = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
