services:
  api:
    image: drdonoso/finlytics
    restart: unless-stopped
    ports:
      - "7777:7777"

    environment:
      # --- PostgreSQL connection ---
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-finlytics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finlytics}"

      # --- OpenAI (for AI transaction extraction) ---
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"

      # --- App config ---
      # TIMEZONE decides the calendar day the application uses (statement and
      # ESPP reminders); TZ also aligns the process clock so log timestamps do
      # not drift away from the UI.
      TIMEZONE: "${TIMEZONE:-Europe/Madrid}"
      TZ: "${TIMEZONE:-Europe/Madrid}"
      UPLOAD_DIR: /app/data/uploads

      # --- Auth ---
      AUTH_SECRET: "${AUTH_SECRET:-}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      AUTH_TOKEN_EXPIRE_DAYS: "${AUTH_TOKEN_EXPIRE_DAYS:-7}"
      AUTH_LOGIN_MAX_ATTEMPTS: "${AUTH_LOGIN_MAX_ATTEMPTS:-10}"
      AUTH_LOGIN_WINDOW_SECONDS: "${AUTH_LOGIN_WINDOW_SECONDS:-300}"
      FINLYTICS_ENCRYPTION_KEY: "${FINLYTICS_ENCRYPTION_KEY:-}"

    volumes:
      - "./data:/app/data"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-finlytics}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-finlytics}"

    volumes:
      # postgres 18+ stores data under major-version-specific directories, so the
      # mount is /var/lib/postgresql (not .../data as it was on 16). The image
      # refuses to start if it finds a 16-era data directory at the old path.
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finlytics}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
