# nginx config for the static Finlytics demo (Dockerfile, `--target demo`).
#
# Named `.demo` although there is no sibling `nginx.conf`: nginx is used ONLY by
# the demo image. The production image has no nginx at all — FastAPI serves the
# SPA itself (see the catch-all route in src/finlytics/app.py). A bare
# `nginx.conf` at the repo root would imply otherwise.
#
# Two things here are not optional:
#
#  1. SPA fallback — the app uses BrowserRouter, so /analytics and friends only
#     exist client-side. Without try_files a deep link or a refresh returns 404.
#  2. mockServiceWorker.js must never be served stale. It is the whole API layer
#     of the demo; a cached old copy silently breaks every screen.
#
# Cache-Control is driven by one map so a single add_header block applies at
# server level. (nginx drops inherited add_header directives as soon as a
# location declares its own, which is an easy way to lose the security headers.)

map $uri $demo_cache_control {
    default       "no-cache";
    "~^/assets/"  "public, max-age=31536000, immutable";   # Vite content-hashes these
}

server {
    # Same port inside the container as the one published on the host, so the
    # mapping in docker-compose.demo.yml is 7778:7778 rather than a translation.
    listen      7778;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Fully synthetic data, but there is no reason to let it be framed or sniffed.
    add_header Cache-Control        $demo_cache_control always;
    add_header Service-Worker-Allowed "/"               always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header X-Frame-Options        "SAMEORIGIN"      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Container healthcheck / uptime probes.
    # Uses default_type rather than `add_header Content-Type`: any add_header in
    # a location cancels the inherited server-level ones (and would emit a
    # duplicate Content-Type on top of nginx's default).
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # `_headers` is the Cloudflare equivalent of this config, emitted into
    # dist-demo by vite.config.ts so the same bundle can be deployed to a CDN.
    # Cloudflare consumes the file rather than serving it; match that here
    # instead of publishing our routing rules. `_redirects` is covered too, in
    # case one is ever added back (see AGENTS.md for why there isn't one).
    location ~ ^/_(redirects|headers)$ {
        access_log off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
